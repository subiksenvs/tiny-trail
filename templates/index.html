<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="/static/app.css"></head><body><header><div><small>{{domain}} / WORKSPACE</small><h1>{{title}}</h1><p>{{description}}</p></div><span id="count" class="count">0 saved</span></header><main><section class="panel"><h2>Ask your AI coach</h2><p>Get an idea, checklist, or practical next step. Demo responses work without an API key.</p><form id="coach"><textarea name="prompt" placeholder="What should I do next?" required></textarea><button>Ask coach</button></form><div id="answer" aria-live="polite"></div></section><section class="panel"><h2 id="formtitle">Create {{label}}</h2><form id="editor">{% for f in fields %}<label>{{f|replace('_',' ')|title}}{% if f in ['body','notes','why'] %}<textarea name="{{f}}" rows="3"></textarea>{% else %}<input name="{{f}}">{% endif %}</label>{% endfor %}<button id="save">Save {{label}}</button><button type="button" id="cancel" class="quiet hidden">Cancel edit</button></form></section><section class="panel library"><div class="bar"><h2>Your {{label|lower}} library</h2><input id="search" placeholder="Search saved items"></div><div id="items"></div></section></main><script>window.APP_FIELDS={{fields|tojson}};window.APP_LABEL={{label|tojson}}</script><script src="/static/app.js"></script></body></html>
